<!doctype html>
<!-- Local-only mobile test harness. Headless Chrome clamps its window to
     ~500px, so a phone-width viewport has to come from an iframe. Serve the
     site (python3 -m http.server 8899) and open, e.g.:

       _devframe.html?u=/zh-Hant/&h=844          — render at 390px wide
       _devframe.html?u=/zh-Hant/&act=menu       — with the drawer open
       _devframe.html?u=/zh-Hant/&act=lang       — with the language menu open

     The page title reports scrollWidth vs clientWidth, which is how the
     sideways-scroll regression gets caught (--dump-dom | grep title).
     The leading underscore keeps Jekyll from publishing this file. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #222; }
  iframe { width: 390px; border: 0; display: block; }
</style>
</head>
<body>
<iframe id="f"></iframe>
<script>
var p = new URLSearchParams(location.search);
var f = document.getElementById("f");
f.style.height = (p.get("h") || 844) + "px";
f.addEventListener("load", function () {
  var d = f.contentDocument;
  var act = p.get("act");
  if (act) d.querySelector("." + act + "btn").click();
  document.title = "scrollW=" + d.documentElement.scrollWidth +
                   " clientW=" + d.documentElement.clientWidth;
});
f.src = p.get("u") || "/";
</script>
</body>
</html>
